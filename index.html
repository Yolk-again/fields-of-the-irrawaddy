
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#19291f" />
    <title>Fields of the Irrawaddy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <header class="site-header">
        <div class="brand">
          <div class="brand-icon">FI</div>
          <div>
            <p class="eyebrow">A MYANMAR COUNTRYSIDE ADVENTURE</p>
            <h1>Fields of the Irrawaddy</h1>
          </div>
        </div>

        <div class="prototype-label">BROWSER PROTOTYPE · 0.1</div>
      </header>

      <main>
        <section class="game-panel">
          <div id="game-container"></div>
        </section>

        <section class="game-information">
          <div>
            <span class="info-label">CURRENT BUILD</span>
            <strong>Farm Exploration</strong>
          </div>

          <div>
            <span class="info-label">CONTROLS</span>
            <strong>WASD / Arrow Keys</strong>
          </div>

          <div>
            <span class="info-label">PLATFORM</span>
            <strong>Web Browser</strong>
          </div>
        </section>
      </main>

      <footer>
        Fields of the Irrawaddy · An independent Myanmar farming game project
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
